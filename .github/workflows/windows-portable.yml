name: Windows Portable Candidate

run-name: Windows Portable candidate from ${{ github.ref_name }}

# 只产出候选产物：不创建 Release、不打 tag、不推送任何资产到远端。
# 触发方式只有手动 workflow_dispatch；本仓库没有 tag/release 触发面。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  windows-portable:
    name: windows-portable-x64 candidate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Windows Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'package.json', 'packages/neuro-book/package.json', 'packages/neuro-book-contracts/package.json', 'packages/neuro-book-manager/package.json') }}
      - name: Install frozen workspace dependencies
        run: bun scripts/release/install-dependencies.ts --linker hoisted
      - name: Prepare Release output identity
        run: bun scripts/release/release-output.ts prepare --github-env
      # ⚠️ 每个验证器独占一个 step：pwsh/bash 的 `run: |` 只回报最后一条命令的退出码，
      # 多条命令合并会把中间失败静默吞掉，CI 变绿而实际有红测试（实测踩过）。
      - name: Verify Owned Process lifecycle
        run: bun run --cwd packages/owned-process test
      - name: Verify Windows Owned Process smoke
        run: bun run test:windows-owned-process
      - name: Verify Agent State Root paths
        run: bun run --cwd packages/neuro-book test:agent-state-root
      - name: Build Product Runtime Image
        run: bun run --cwd packages/neuro-book nuxt:build
      - name: Build Source archive for portable assembly
        run: bun run release:source
      - name: Build Windows x64 Product archive
        run: bun run release:product:windows
      - name: Build Manager bundle for portable embedding
        run: bun run manager:build
      - name: Assemble Windows Portable archive
        run: bun run package:windows-portable
      - name: Smoke Windows Portable runtime contract
        shell: pwsh
        run: |
          $portableRoot = Join-Path $env:RUNNER_TEMP "inkwell-portable-smoke"
          $scratchRoot = Join-Path $env:RUNNER_TEMP "inkwell-windows-product-contract"
          Remove-Item -LiteralPath $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $scratchRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath "$env:NEURO_BOOK_RELEASE_DIR/inkwell-windows-x64.zip" -DestinationPath $portableRoot
          $portableRoot = (Resolve-Path -LiteralPath $portableRoot).Path
          $installationManifest = Join-Path $portableRoot ".deploy/installation.json"
          $manifest = Get-Content -Raw $installationManifest | ConvertFrom-Json
          $bun = Join-Path $portableRoot $manifest.components.applicationRuntime.path
          bun scripts/release/verify-windows-product.ts --product-root "$portableRoot" --scratch-root "$scratchRoot" --bun-runtime "$bun" --installation-manifest "$installationManifest"
          if ($LASTEXITCODE -ne 0) { throw "Portable Runtime Contract smoke failed: $LASTEXITCODE" }
      - name: Smoke Windows Portable browser, authenticated restart and lifecycle
        shell: pwsh
        run: |
          $portableRoot = (Resolve-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "inkwell-portable-smoke")).Path
          $chrome = Join-Path $env:ProgramFiles "Google/Chrome/Application/chrome.exe"
          if (-not (Test-Path -LiteralPath $chrome)) {
            $chrome = Join-Path ${env:ProgramFiles(x86)} "Microsoft/Edge/Application/msedge.exe"
          }
          bun scripts/release/verify-windows-portable-restart.ts --portable-root "$portableRoot" --browser-executable "$chrome"
          if ($LASTEXITCODE -ne 0) { throw "Portable browser/auth/restart acceptance failed: $LASTEXITCODE" }
      - name: Smoke Windows Portable service over curl
        shell: pwsh
        run: |
          $port = 39123
          $baseUrl = "http://127.0.0.1:$port"
          $portableRoot = (Resolve-Path -LiteralPath (Join-Path $env:RUNNER_TEMP "inkwell-portable-smoke")).Path
          $manifest = Get-Content -Raw (Join-Path $portableRoot ".deploy/installation.json") | ConvertFrom-Json
          $managerRuntime = Join-Path $portableRoot $manifest.components.managerRuntime.path
          $managerBundle = Join-Path $portableRoot $manifest.components.manager.path
          $stdout = Join-Path $portableRoot "data/logs/curl-smoke.stdout.log"
          $stderr = Join-Path $portableRoot "data/logs/curl-smoke.stderr.log"
          $managerArguments = @("$managerBundle", "--root", "$portableRoot", "start")
          $managerProcess = Start-Process -FilePath $managerRuntime -ArgumentList $managerArguments -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 240; $attempt++) {
              if ($managerProcess.HasExited) { break }
              try {
                $probe = Invoke-WebRequest -Uri "$baseUrl/api/app/version" -TimeoutSec 1
                if ($probe.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              Get-Content -Raw $stdout -ErrorAction SilentlyContinue | Write-Host
              Get-Content -Raw $stderr -ErrorAction SilentlyContinue | Write-Host
              throw "Portable Manager did not become ready at $baseUrl"
            }
            $versionBody = curl.exe --silent --show-error --fail --max-time 30 "$baseUrl/api/app/version"
            if ($LASTEXITCODE -ne 0) { throw "curl /api/app/version failed: $LASTEXITCODE" }
            $version = $versionBody | ConvertFrom-Json
            $expectedLabel = "v$($manifest.appVersion)"
            if ($version.versionLabel -ne $expectedLabel) { throw "curl version endpoint returned $($version.versionLabel), expected $expectedLabel" }
            $versionStatus = curl.exe --silent --show-error --output NUL --write-out "%{http_code}" --max-time 30 "$baseUrl/api/app/version"
            if ($versionStatus.Trim() -ne "200") { throw "curl version endpoint status: $($versionStatus.Trim())" }
            $meStatus = curl.exe --silent --show-error --output NUL --write-out "%{http_code}" --max-time 30 "$baseUrl/api/auth/me"
            if ($LASTEXITCODE -ne 0) { throw "curl /api/auth/me failed: $LASTEXITCODE" }
            if ($meStatus.Trim() -notin @("200", "401")) { throw "curl session endpoint status: $($meStatus.Trim())" }
            Write-Host "curl smoke ok: versionLabel=$($version.versionLabel) versionStatus=$($versionStatus.Trim()) meStatus=$($meStatus.Trim())"
            $versionBody | Set-Content -LiteralPath (Join-Path $portableRoot "data/logs/curl-smoke-version.json") -Encoding utf8
          } finally {
            if (-not $managerProcess.HasExited) {
              Stop-Process -Id $managerProcess.Id -Force
              [void]$managerProcess.WaitForExit(10000)
            }
            $released = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, $port)
                $listener.Start()
                $listener.Stop()
                $released = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $released) { throw "Portable Manager did not release port $port" }
          }
      - name: Upload Windows Portable candidate
        uses: actions/upload-artifact@v4
        with:
          name: inkwell-windows-portable-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/inkwell-windows-x64.zip
            ${{ env.NEURO_BOOK_RELEASE_DIR }}/inkwell-source.zip
      - name: Upload Windows Portable diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-diagnostics
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/inkwell-portable-smoke/data/logs/**
            ${{ runner.temp }}/inkwell-portable-smoke/data/workspace/.nbook/logs/**
            ${{ runner.temp }}/inkwell-windows-product-contract/**
  # 把 Windows 上 manager 既有回归单独摆出来，不挡出包，但不允许再被静默吞掉。
  #
  # 背景：T2「默认数据目录改 Inkwell 专属」只改了 packages/neuro-book-manager/src/，
  # 漏改 desktop-installation / paths / uninstaller 三个测试文件里写死的 NeuroBook
  # 字面量，于是 Windows 上 7 个用例必红；Linux 上这些用例被 skip，所以本地全绿。
  # 这是本仓库既有缺陷，不是本 workflow 引入的。
  #
  # job 级 continue-on-error：这个 job 在运行图里显式标红可被看见，但不会把整轮 run
  # 判红、从而不挡住上面的 Portable 出包交付物。修好这三个测试文件后应删除本 flag。
  windows-manager-regression:
    name: Windows manager regression (known red)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frozen workspace dependencies
        run: bun scripts/release/install-dependencies.ts --linker hoisted
      - name: Verify Windows Manager adapters
        run: bun run manager:test
